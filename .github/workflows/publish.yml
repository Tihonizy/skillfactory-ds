name: Publish charts to GitHub Pages

on:
  push:
    branches: ["main"]
    paths:
      - "index.html"
      - "06-yandex-maps-review-sentiment/public/**"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # The site keeps the original /project_6/ URLs so that links shared earlier still work.
      - name: Prepare deploy folder
        run: |
          mkdir -p deploy/project_6
          cp index.html deploy/
          cp -r 06-yandex-maps-review-sentiment/public/. deploy/project_6/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          keep_files: false
